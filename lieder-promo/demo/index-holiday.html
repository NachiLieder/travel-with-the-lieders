<script>
/* ---------- helpers ---------- */
const DUR = 30;
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const lerp = (a,b,x)=>a+(b-a)*x;
function bezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=s=>((ax*s+bx)*s+cx)*s, Y=s=>((ay*s+by)*s+cy)*s, dX=s=>(3*ax*s+2*bx)*s+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let s=x;
    for(let i=0;i<8;i++){const e=X(s)-x; if(Math.abs(e)<1e-5)break; const d=dX(s); if(Math.abs(d)<1e-6)break; s-=e/d;}
    return Y(s); };
}
const E = { snap:bezier(.25,1,.5,1), pan:bezier(.65,0,.2,1), back:bezier(.34,1.56,.64,1), lin:x=>x, io:bezier(.45,0,.55,1) };
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,u)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],u)).toString(16).padStart(2,'0')).join('');};

function camAt(t){

let wv='';
for(let r=0;r<5;r++){ let d=`M0 ${HORIZON+30+r*60}`; for(let x=0;x<=4800;x+=120) d+=` q30 ${-14-r*2} 60 0 t60 0`;
  wv+=`<path d="${d}" fill="none" stroke="#fff" stroke-opacity="${.5-r*.07}" stroke-width="${3+r*.6}" stroke-linecap="round"/>`; }
$('waves').innerHTML=`<svg width="5000" height="1080" style="overflow:visible">${wv}</svg>`;
// palms
function palm(x,base,sc,flip,i){
  const f=[[-150,-20,-10],[-120,-50,-28],[-70,-80,-45],[0,-90,-90],[70,-80,-135],[120,-50,-152],[150,-20,-170]];
  return `<g transform="translate(${x} ${base}) scale(${flip*sc} ${sc})">
    <path d="M0 0 C12 -120 -10 -230 25 -330 L45 -326 C10 -230 32 -120 22 0Z" fill="#3b2a45"/>
    <g class="crown" data-i="${i}" transform="translate(35 -328)">${[[-60,-20],[-30,-50],[10,-60],[50,-40],[75,-6],[-85,10],[100,25]].map(([ex,ey],k)=>
      `<path d="M0 0 C${ex*.4} ${ey-40} ${ex*.8} ${ey-30} ${ex*1.3} ${ey+40} C${ex*.8} ${ey+5} ${ex*.4} ${ey-5} 0 8Z" fill="${k%2?'#1c6b4f':'#238a5f'}" transform="scale(1.6)"/>`).join('')}
      <circle cx="-4" cy="10" r="9" fill="#5a3a2a"/><circle cx="12" cy="14" r="9" fill="#5a3a2a"/></g></g>`; }
let pm=''; [[60,1080,1,1],[640,1080,.7,-1],[1500,1080,1.05,1],[2300,1080,.75,-1],[3200,1080,1,1],[4100,1080,.8,-1],[4900,1080,1,1]].forEach((p,i)=>pm+=palm(p[0],p[1]+10,p[2]*.9,p[3],i));
$('palms').innerHTML=`<svg width="5600" height="1080" style="overflow:visible">${pm}</svg>`;
const crowns=[...document.querySelectorAll('.crown')];
const crownBase=crowns.map(c=>c.getAttribute('transform'));

const SKY=[ // t, top, mid, horizon, sea top, sea bottom, sun colour, sun y
  [0,  '#1f8fe6','#7fd0f5','#ffeab5','#19b3c9','#0b7ba2','#fff4c2',170],
  [13, '#3f86d9','#ffc27a','#ffe3a0','#12a1b0','#0a6e8e','#ffe08a',360],
  [26, '#3a2a7e','#e0597b','#ff9d5a','#17608a','#0a2f5e','#ffb45a',640]
];
function skyAt(t){
  let a=SKY[0],b=SKY[1]; if(t>SKY[1][0]){a=SKY[1];b=SKY[2];}
  const u=clamp((t-a[0])/(b[0]-a[0]));
  return {top:mix(a[1],b[1],u).replace('#',''),mid:mix(a[2],b[2],u),hor:mix(a[3],b[3],u),s0:mix(a[4],b[4],u),s1:mix(a[5],b[5],u),sun:mix(a[6],b[6],u),sy:lerp(a[7],b[7],u)};
}
const skyEl=$('sky'), sunEl=$('sun');

/* ---------- world ---------- */
const world=$('world');
const routeSvg=document.createElementNS(SVGNS,'svg'); routeSvg.setAttribute('class','lines'); world.appendChild(routeSvg);
const routeY=x=>470+Math.sin(x/170)*30;
const LASTX=SCREENS[SCREENS.length-1].X;
let dd=''; for(let x=-600;x<=LASTX+1800;x+=20) dd+=(x===-600?'M':'L')+x+' '+routeY(x).toFixed(1);
const routePath=document.createElementNS(SVGNS,'path');
routePath.setAttribute('d',dd); routePath.setAttribute('fill','none'); routePath.setAttribute('stroke','#fff'); routePath.setAttribute('stroke-width','5');
routePath.setAttribute('stroke-dasharray','4 20'); routePath.setAttribute('stroke-linecap','round'); routePath.setAttribute('opacity','.85');
routeSvg.appendChild(routePath);
const plane=document.createElement('div');
plane.style.cssText='position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))';
plane.innerHTML=`<svg viewBox="0 0 24 24" width="84" height="84" style="stroke:#fff;fill:#F4786A;stroke-width:1.2;stroke-linejoin:round"><g transform="rotate(45 12 12)">${ICON.plane}</g></svg>`;
world.appendChild(plane);
const linesSvg=document.createElementNS(SVGNS,'svg'); linesSvg.setAttribute('class','lines'); linesSvg.style.zIndex=6; world.appendChild(linesSvg);

SCREENS.forEach((S,i)=>{
  S.w=S.nat[0]*S.k; S.h=S.nat[1]*S.k;
  const el=document.createElement('div'); el.className='screen'; S.el=el;
  el.innerHTML=`<img class="logo" src="logo.png" alt=""><div class="inner" style="width:${S.nat[0]}px;height:${S.nat[1]}px;transform:scale(${S.k})">${S.rep()}</div><img class="shot" src="shots/${S.key}.png" alt="">`;
  const shot=el.querySelector('.shot');
  shot.onload=()=>{shot.style.display='block'; el.querySelector('.inner').style.display='none';};
  world.appendChild(el);
  S.logo=el.querySelector('.logo'); S.inner=el.querySelector('.inner');
  // title
  const tl=document.createElement('div'); tl.className='title';
  tl.style.left=(S.X-S.w/2-90-560)+'px'; tl.style.top='-210px'; tl.style.zIndex=7;
  tl.innerHTML=`<div class="num">0${i+1} / 0${SCREENS.length}</div><div class="h">${S.title.map(l=>l.split(' ').map(w=>`<span class="w">${w}</span>`).join('')+'<br>').join('')}</div><div class="sub">${S.sub}</div>`;
  world.appendChild(tl); S.words=[...tl.querySelectorAll('.w')]; S.numEl=tl.querySelector('.num'); S.subEl=tl.querySelector('.sub');
  // callouts
  const n=S.calls.length, ys=n===3?[-200,0,200]:n===2?[-110,110]:[0];
  S.calls.forEach((c,j)=>{
    c.t=S.a+(c.at!==undefined?c.at:OFF[j]); c.u=c.until!==undefined?S.a+c.until:99;
    const rx=-S.w/2+c.r[0]*S.w, ry=-S.h/2+c.r[1]*S.h, rw=c.r[2]*S.w, rh=c.r[3]*S.h;
    const ring=document.createElement('div'); ring.className='ring';
    ring.style.cssText+=`left:${S.X+rx-6}px;top:${ry-6}px;width:${rw+12}px;height:${rh+12}px;z-index:6`;
    world.appendChild(ring); c.ring=ring;
    const px=S.X+S.w/2+130, py=ys[j];
    const pill=document.createElement('div'); pill.className='pill';
    pill.style.left=px+'px'; pill.style.top=(py-42)+'px'; pill.style.zIndex=7;
    pill.innerHTML=`<span class="ic">${svgI(c.ic)}</span>${c.txt}`;
    world.appendChild(pill); c.pill=pill;
    const x1=S.X+rx+rw+6, y1=ry+rh/2, x2=px-8, y2=py, mx=(x1+x2)/2;
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('d',`M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','#FFD36B'); path.setAttribute('stroke-width','4');
    path.setAttribute('stroke-linecap','round'); path.setAttribute('pathLength','1'); path.setAttribute('stroke-dasharray','1');
    linesSvg.appendChild(path); c.path=path;
  });
});
const S_ = Object.fromEntries(SCREENS.map(s=>[s.key,s]));

/* ---------- render(t): a pure function of time, so scrubbing is seamless ---------- */
const veil=$('veil'), pillEl=$('pill'), pillTxt=$('pillTxt'), pillLogo=$('pillLogo'), ctaTag=$('ctaTag'), ctaUrl=$('ctaUrl'), kicker=$('kicker');
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const TYPED='מפלי ארסה';

function render(t){
  const cam=camAt(t);
  world.style.transform=`translate(${-cam.x*cam.s}px,${-cam.y*cam.s}px) scale(${cam.s})`;

  /* holiday backdrop: sky shifts from morning to sunset */
  const k=skyAt(t);
  skyEl.style.background=`linear-gradient(180deg,#${k.top} 0%,${k.mid} 55%,${k.hor} 100%)`;
  $('sea0').setAttribute('stop-color',k.s0); $('sea1').setAttribute('stop-color',k.s1);
  sunEl.style.background=`radial-gradient(circle,${k.sun} 0 36%,${k.sun}aa 38%,${k.sun}00 70%)`;
  sunEl.style.transform=`translate(${-cam.x*.03}px,${k.sy-130}px)`;
  $('clouds').style.transform=`translate(${-cam.x*.14-t*14}px,0)`;
  $('islands').style.transform=`translate(${-cam.x*.07}px,0)`;
  $('waves').style.transform=`translate(${-((cam.x*.3+t*46)%240)-0}px,0)`;
  $('palms').style.transform=`translate(${-cam.x*.55}px,0)`;
  crowns.forEach((c,i)=>c.setAttribute('transform',crownBase[i]+` rotate(${Math.sin(t*1.4+i)*2.5})`));
  kicker.style.opacity=seg(t,.2,.9)*(1-seg(t,2.0,2.8)); kicker.style.transform=`translateY(${(1-E.snap(seg(t,.2,1)))*30}px)`;

  const globalFade=1-seg(t,ZOOM0-.5,ZOOM0+.7);
  const dim=seg(t,ZOOM0+1.4,ZOOM0+2.8);

  // plane + route thread
  const px = t<ZOOM0 ? cam.x+260+Math.sin(t*1.1)*90 : LASTX+260+Math.sin(ZOOM0*1.1)*90+(t-ZOOM0)*750;
  const py=routeY(px), slope=Math.atan2(routeY(px+5)-routeY(px-5),10);
  plane.style.transform=`translate(${px}px,${py}px) rotate(${slope*57.3}deg)`;
  routePath.setAttribute('stroke-dashoffset',(-t*60).toFixed(1));

  SCREENS.forEach((S,i)=>{
    const appear=E.back(seg(t,S.r0,S.r0+.55));
    const m=E.snap(seg(t,S.r0+.45,S.r0+1.7));
    const w=lerp(150,S.w,m), h=lerp(150,S.h,m), rad=lerp(75,40,m);
    const e=S.el;
    e.style.width=w+'px'; e.style.height=h+'px'; e.style.borderRadius=rad+'px';
    e.style.left=(S.X-w/2)+'px'; e.style.top=(-h/2)+'px';
    e.style.transform=`scale(${appear})`; e.style.opacity=(1-.5*dim);
    S.logo.style.opacity=1-seg(m,.05,.45);
    S.inner.style.opacity=seg(m,.35,.75);
    S.inner.style.left=((w-S.nat[0]*S.k)/2)+'px'; S.inner.style.top=((h-S.nat[1]*S.k)/2)+'px';

    const textFade=Math.min(globalFade,1-seg(t,S.d-.1,S.d+.6));
    const t0=i===0?S.r0+.35:S.a-.45;
    S.words.forEach((el,kk)=>{ const u=E.back(seg(t,t0+kk*.12,t0+.8+kk*.12));
      el.style.opacity=clamp(u*1.6)*textFade; el.style.transform=`translateY(${(1-u)*70}px) rotate(${(1-u)*-3}deg)`; });
    const us=E.snap(seg(t,t0+.45,t0+1.2));
    S.numEl.style.opacity=us*textFade; S.subEl.style.opacity=us*textFade; S.subEl.style.transform=`translateY(${(1-us)*30}px)`;

    S.calls.forEach(c=>{
      const u=E.back(seg(t,c.t,c.t+.6)), l=E.snap(seg(t,c.t+.05,c.t+.7)); const gone=1-seg(t,c.u,c.u+.35); const tf=textFade*gone;
      c.ring.style.opacity=clamp(u*2)*tf; c.ring.style.transform=`scale(${lerp(1.5,1,u)})`;
      c.ring.style.boxShadow=`0 0 0 ${6+Math.sin(t*5)*3}px rgba(255,211,107,.25),0 0 ${24+Math.sin(t*5)*10}px rgba(255,211,107,.8)`;
      c.path.style.strokeDashoffset=(1-l); c.path.style.opacity=tf;
      c.pill.style.opacity=clamp(u*2)*tf; c.pill.style.transform=`translateX(${(1-u)*-80}px) scale(${lerp(.6,1,u)})`;
    });
  });

  /* ---- living details inside each screen ---- */
  const H=S_.home, D=S_.dash, R=S_.route, M=S_.map, F=S_.form, X=S_.exp;
  // home: city chips step through, countdown ticks down, button pulses
  const ai = t<H.a+1.7?0:Math.min(5,Math.floor((t-(H.a+1.7))/.4));
  H.el.querySelectorAll('.chip').forEach((c,kk)=>{ const on=kk===ai; c.style.background=on?'#fff':'rgba(80,70,150,.7)'; c.style.color=on?'#1b1040':'#fff'; });
  const b1=$('s1btn'); if(b1) b1.style.transform=`scale(${1+.04*Math.max(0,Math.sin((t-H.a-2.4)*6))*seg(t,H.a+2.4,H.d)})`;
  const cnt=$('cnt'); if(cnt) cnt.textContent=t<H.a+.7?'50':'49';
  // dashboard: chart draws, currency cycles, route line draws, pins drop
  const cc=$('chartclip'); if(cc) cc.style.width=(E.snap(seg(t,D.a+.2,D.a+1.1))*100)+'%';
  const ci=t<D.calls[0].t?0:Math.floor((t-D.calls[0].t)/.55)%3;
  D.el.querySelectorAll('.cur').forEach((c,kk)=>{ const on=kk===ci; c.style.background=on?'#fff':'transparent'; c.style.color=on?'#1b1040':'#fff'; });
  const sym=$('curSym'); if(sym) sym.textContent=['₪','฿','$'][ci];
  [['dpin2',D.a+1.2],['dpin3',D.a+1.5]].forEach(([id,at])=>{ const p=$(id); if(!p)return; const u=E.back(seg(t,at,at+.7));
    p.style.transform=`rotate(-45deg) translateY(${(1-u)*-100}px) scale(${u})`; p.style.opacity=clamp(u*3); });
  const dl=$('dashLine'); if(dl) dl.style.strokeDashoffset=1-E.snap(seg(t,D.a+1.7,D.a+2.5));
  // route: cards slide in
  R.el.querySelectorAll('.tcard').forEach((c,kk)=>{ const u=E.snap(seg(t,R.r0+1+kk*.18,R.r0+1.9+kk*.18)); c.style.transform=`translateY(${(1-u)*60}px)`; c.style.opacity=u; });
  // map: pins drop, route draws
  [['pin1',M.a+.2],['pin2',M.a+.9],['pin3',M.a+1.2]].forEach(([id,at])=>{ const p=$(id); if(!p)return;
    const u=E.back(seg(t,at,at+.7)); p.style.transform=`rotate(-45deg) translateY(${(1-u)*-120}px) scale(${u})`; p.style.opacity=clamp(u*3); });
  const ml=$('mapLine'); if(ml) ml.style.strokeDashoffset=1-E.snap(seg(t,M.a+1.5,M.a+2.3));
  ['lb2','lb3'].forEach((id,kk)=>{ const l=$(id); if(l) l.style.opacity=seg(t,M.a+1.3+kk*.3,M.a+1.8+kk*.3); });
  // form: type the name, scroll down, flip toggles
  const n=Math.floor(seg(t,F.a+.35,F.a+1.0)*TYPED.length);
  const ft=$('ftype'); if(ft){ ft.textContent=n?TYPED.slice(0,n):'למשל: מפלי ארסה'; ft.style.color=n?'#fff':'#8d87b8'; }
  const fc=$('fcaret'); if(fc) fc.style.opacity=(t>F.a+.3&&t<F.a+1.8&&Math.floor(t*3)%2===0)?1:0;
  const fs=$('fscroll'); if(fs) fs.style.transform=`translateY(${-879*E.io(seg(t,F.a+1.5,F.a+2.8))}px)`;
  [['tg2',F.a+3.05],['tg3',F.a+3.3]].forEach(([id,at])=>{ const g=$(id); if(!g)return; const on=t>at;
    g.style.background=on?'#9a82ff':'#4a3d8f'; g.firstChild.style.left=on?'3px':'21px'; });
  const sv=$('fsave'); if(sv) sv.style.background=`rgba(244,120,106,${.5+.5*seg(t,F.a+1.0,F.a+1.2)})`;
  // expenses: count up
  const f=E.snap(seg(t,X.a+.7,X.a+2.4));
  const tot=$('tot'), tot2=$('tot2'), bar=$('bar');
  if(tot){ tot.textContent=fmt(14714.14*f); tot2.textContent=fmt(14714.14*f); bar.style.width=(f*100)+'%'; }
  const conv=$('conv'); if(conv) conv.style.transform=`scale(${1+.03*Math.max(0,Math.sin((t-X.a-.85)*7))*seg(t,X.a+.85,X.a+1.8)})`;

  /* closing: dim the world, logo circle morphs into the CTA pill */
  const C0=ZOOM0+1.6;
  veil.style.opacity=seg(t,C0-.4,C0+.6);
  const c1=E.back(seg(t,C0+.2,C0+.9)), c2=E.snap(seg(t,C0+.9,C0+2.1));
  pillEl.style.width=lerp(170,980,c2)+'px'; pillEl.style.transform=`scale(${c1})`; pillEl.style.opacity=clamp(c1*3);
  pillLogo.style.opacity=1-seg(c2,.1,.5);
  pillTxt.style.opacity=seg(c2,.55,.95); pillTxt.style.transform=`translateX(${(1-seg(c2,.55,1))*40}px)`;
  const tg=E.snap(seg(t,C0+.6,C0+1.5)); ctaTag.style.opacity=tg; ctaTag.style.transform=`translateY(${(1-tg)*40}px)`;
  const ur=E.snap(seg(t,C0+2.0,C0+2.8)); ctaUrl.style.opacity=ur; ctaUrl.style.transform=`translateY(${(1-ur)*24}px)`;
  pillEl.style.boxShadow=`0 26px ${60+26+Math.sin(t*6)*14}px rgba(244,120,106,.55)`;
}

/* ---------- player ---------- */
let t=0, playing=false, last=0;
const seek=$('seek'), timeEl=$('time'), playBtn=$('play'), playTxt=$('playTxt'), ico=$('icoPlay');
const PLAY='<polygon points="6 4 20 12 6 20 6 4" fill="#fff"/>', PAUSE='<rect x="6" y="4" width="4" height="16" fill="#fff"/><rect x="14" y="4" width="4" height="16" fill="#fff"/>';
const mm=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
function paint(){ render(t); seek.value=t/DUR*30000; seek.style.setProperty('--p',(t/DUR*100)+'%'); timeEl.textContent=`${mm(t)} / 0:30`;
  ico.innerHTML=playing?PAUSE:PLAY; playTxt.textContent=playing?'Pause':(t>=DUR?'Replay':'Play'); }
function tick(now){ if(playing){ t=Math.min(DUR,t+(now-last)/1000); if(t>=DUR) playing=false; paint(); } last=now; requestAnimationFrame(tick); }
function toggle(){ if(!playing && t>=DUR) t=0; playing=!playing; last=performance.now(); paint(); }
playBtn.onclick=toggle;
$('restart').onclick=()=>{ t=0; playing=true; last=performance.now(); paint(); };
seek.oninput=()=>{ t=seek.value/30000*DUR; paint(); };
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();} if(e.key==='r'||e.key==='R'){$('restart').click();} });
$('stage').addEventListener('click',toggle);
function fit(){
  const vp=$('viewport'); const s=Math.min(vp.clientWidth/1920, vp.clientHeight/1080);
  $('stage').style.transform=`scale(${s})`;
  $('stage').style.margin=`${-(1080*(1-s))/2}px ${-(1920*(1-s))/2}px`;
}
addEventListener('resize',fit); fit();
const q=new URLSearchParams(location.search).get('t'); if(q) t=clamp(parseFloat(q),0,DUR);
paint(); requestAnimationFrame(tick);
if(!q){ setTimeout(()=>{ if(t===0){ playing=true; last=performance.now(); paint(); } },400); }
</script>
</body>
</html>
